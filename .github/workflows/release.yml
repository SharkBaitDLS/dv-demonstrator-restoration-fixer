name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, Windows]

    env:
      ReferencePath: 'C:\Program Files (x86)\Steam\steamapps\common\Derail Valley\DerailValley_Data\Managed\'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Pull LFS files
        run: git lfs pull

      - name: Classify tag
        id: tag
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          if ($tag -match '^[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Host "Tag '$tag' is a full release."
            "candidate=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Tag '$tag' is a release candidate."
            "candidate=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Verify tag matches a valid manifest entry
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $params = @{ Tag = '${{ github.ref_name }}' }
          if ('${{ steps.tag.outputs.candidate }}' -eq 'true') {
            $params.WarnOnly = $true
          }
          ./validate-manifests.ps1 @params

      - name: Build and package
        run: dotnet build DRF.sln -c Release

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ghArgs = @(
            'release', 'create', '${{ github.ref_name }}',
            'dist/DRF.zip'
            '--title', '${{ github.ref_name }}', '--generate-notes'
          )
          if ('${{ steps.tag.outputs.candidate }}' -eq 'true') {
            $ghArgs += '--draft'
            $ghArgs += '--prerelease'
          }
          gh @ghArgs
